name: Test_Change
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - id: file_changes
        uses: tj-actions/changed-files@v44

      - name: Record PR number
        run: |
          mkdir -p pr-comments
          echo "${{ github.event.number }}" > pr-comments/pr-number.txt

      - name: Craft artifact-controlled comment
        run: |
          mkdir -p pr-comments
          echo "1" > pr-comments/pr-number.txt
          cat > pr-comments/50-artifact-demo.md <<'MD'
          ### workflow_run artifact-trust demo

          This block was **not** written by the `workflow_run` job. It is file
          `50-artifact-demo.md` taken from the `pr-comments` artifact uploaded by
          the *pull_request* run of this fork PR, and posted verbatim by the
          privileged `Comment_PR` job (`pull-requests: write`) because
          `pr-number.txt` in the same artifact says `1`.

          Marker: `artifact-branch-B`. This comment is posted onto PR #1 by the artifact of **this** PR.

MD

      - name: Upload PR comments artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-comments
          path: pr-comments/
          if-no-files-found: ignore
          retention-days: 1
